name: ci

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests (node runs the site's JS checks)
        run: python -m unittest discover tests -v

      - name: Build all targets
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            python build.py --target all --out dist --version "${GITHUB_REF_NAME}"
          else
            python build.py --target all --out dist
          fi

      - name: Validate build output
        run: python build.py --check --out dist

      - name: Smoke-test packaged tools
        run: |
          printf '#!sketch\n\n--- T ---\n(User) -> [API] -> |DB|\n' > /tmp/t.sigil
          dist/claude/skills/sigil/scripts/lint.py /tmp/t.sigil
          python dist/claude/skills/sigil/scripts/render.py /tmp/t.sigil
          python dist/claude/skills/sigil/scripts/view.py /tmp/t.sigil --once
          python dist/claude/skills/sigil/scripts/view.py /tmp/t.sigil --once --theme sigil

      - name: Build site
        run: python site/build_site.py --out _site

      - name: claude plugin validate (optional)
        continue-on-error: true
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate --strict dist/claude
          claude plugin validate --strict dist/claude-marketplace

      - uses: actions/upload-artifact@v4
        with:
          name: sigil-dist
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sigil-dist
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
          generate_release_notes: true
